- id: agent-default-model
  config:
    provider: local-private
    model: !!js process.env.DSH_MODEL_ID
- id: llm-pi-ai
  config:
    providers:
      local-private:
        displayName: Local model
        api: openai-completions
        baseURL: !!js process.env.DSH_MODEL_BASE_URL
        apiKeyEnv: DSH_LOCAL_MODEL_KEY
        models:
          - id: !!js process.env.DSH_MODEL_ID
            contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW)
            maxTokens: !!js Number(process.env.DSH_MAX_TOKENS)
            input: [text]
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: xhigh
        reasoning: low
        timeoutMs: 300000
        compat:
          supportsStore: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_WORKSPACE || '/workspace'
- id: approval
  config:
    policy: never
- id: permission
  config:
    defaultPreset: local-workspace
    presets:
      local-workspace:
        sandbox: workspace-write
        approval: never
        name: Local workspace
        description: Write inside the mounted workspace without network escalation.
- id: system-prompt
  config:
    personaSuffix: |
      작업 설명과 결과는 한국어로 작성한다. 필요한 파일을 읽고 최소 수정 후 관련 테스트를 실행한다.
      통과한 검사는 관련 변경이나 새로운 실패 원인 없이 반복하지 않는다.
      모델 추론과 로그는 로컬 환경에 유지한다. 인터넷 도구가 없으면 네트워크 우회를 시도하지 않는다.
      공개 웹 검색은 web_search, 검색 결과의 공개 URL 본문은 web_fetch를 사용한다. 관리형 브라우저는 운영자가 허용한 내부 주소에만 사용한다.
      사용자가 적은 검색어를 먼저 실행한다. 결과가 비었거나 제품·기술이 일치하지 않으면 제품명과 기술명을 영문 표기나 확인된 모델명으로 바꿔 다시 검색한다. 개발 자료를 찾을 때는 GitHub나 공식 문서처럼 자료가 있는 출처를 검색어에 포함할 수 있다. 동일 모델의 자료만 설치 근거로 제시한다.
      제품 사양 조사에서는 브랜드와 제품명만 넣은 짧은 검색어로 제조사 페이지를 찾는다. 긴 문구의 결과가 비었거나 무관하면 사양 항목을 검색어에서 빼고 제품명만 다시 검색한다.
      사용자가 검색이나 공개 페이지 확인을 요청하면 채팅으로 승인 여부를 다시 묻기 전에 해당 도구를 호출한다. 승인 여부는 도구가 처리하며, 자동 승인이 켜져 있으면 검색과 공개 페이지 가져오기가 바로 실행된다. URL 승인이 필요하면 화면의 승인 패널에서 처리한다. 수집기가 공식 URL을 Camoufox로 다시 읽으려면 별도 승인이 필요하다. 제품 페이지에서 403, 확인 페이지 또는 본문 가져오기 오류가 발생하면 같은 URL을 반복 요청하지 않는다. 그 즉시 web_search로 제조사 도메인과 정확한 모델명에 출시 발표를 붙여 검색한다(예: site:제조사도메인 모델명 launch announcement). 결과에서 기존 제품 페이지의 별칭이나 리다이렉트가 아닌 제조사 뉴스·보도자료 또는 공식 문서 저장소의 다른 경로를 골라 web_fetch로 읽는다. 확인 페이지나 403이 반환된 공개 URL을 관리형 브라우저로 다시 열지 않는다. 대체 공식 문서도 읽지 못하면 확인 가능한 범위만 답하고 같은 후보를 반복하지 않는다. 확인한 사양과 출처를 제시하고, 읽은 자료에 없는 항목은 미확인으로 표시한다. 기억이나 검색 요약을 공식 본문으로 인용하지 않는다.
