name: CI master

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      suite:
        description: Manual CI suite to run
        required: true
        default: larger-runner-benchmark
        type: choice
        options:
          - larger-runner-benchmark
          - consolidated-runner-benchmark
          - ssh-helper

# New master pushes and manual runs replace obsolete checks in this workflow/ref.
# Standby drills share cancellation; use completed runs as readiness evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  ssh-helper:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'ssh-helper'
    name: ssh helper / native artifacts
    uses: ./.github/workflows/build-exe-for-ssh-helper.yml
    with:
      targets: node24-linux-x64,node24-linux-arm64,node24-macos-arm64,node24-macos-x64

  # These native runtime carriers are post-merge checks; release keeps all targets.
  python-runtime:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: python runtime / macOS and Linux ARM64
    uses: ./.github/workflows/build-exe-for-python-sdk.yml
    with:
      targets: node24-linux-arm64,node24-macos-arm64,node24-macos-x64
      ci: true

  # Every master push runs the complete unsharded Linux aggregate. It uses the
  # persistent vm-backup pool by default; DSH_CI_FAILOVER_LINUX=github routes it
  # to ubuntu-24.04 when the repository selects GitHub-hosted runners.
  # Push-triggered, so this lane always executes the base branch's own
  # workflow definition. This workflow never listens to pull_request, so the
  # full suite does not appear in PR checks. The self-hosted path uses its
  # persistent pnpm store; the GitHub route uses an ephemeral store, and neither
  # path writes an Actions cache.
  serial-linux-selfhosted:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: serial / linux (full suite)
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'github' && 'ubuntu-24.04'
          || fromJSON('["self-hosted", "linux", "x64", "vm-backup"]') }}
    steps:
      # DSH_ARCHIVE_BASE_REF compares the frozen-archive gate against
      # github.event.before, so full history is required: depth 2 would miss it
      # on multi-commit or force pushes.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Redirect the Node compile cache (enabled by pnpm and TypeScript) off
      # the root partition's /tmp before the first pnpm call in this lane.
      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store
        run: echo "PNPM_CONFIG_STORE_DIR=$HOME/.local/share/pnpm/store" >> "$GITHUB_ENV"

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # Hosted runners install browser dependencies; vm-backup preinstalls them.
      - name: Install Playwright Chromium and WebKit with system dependencies
        if: vars.DSH_CI_FAILOVER_LINUX == 'github'
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium webkit

      - name: Install Playwright Chromium and WebKit from the lockfile
        if: vars.DSH_CI_FAILOVER_LINUX != 'github'
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install chromium webkit

      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Run complete unsharded primary Node CI serially
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.before }}
          DSH_COVERAGE_MAX_WORKERS: '1'
          DSH_E2E_MAX_WORKERS: '1'
          DSH_GATE_CONCURRENCY: '1'
          DSH_OXLINT_THREADS: '1'
          DSH_PUBLINT_CONCURRENCY: '1'
          DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
        run: pnpm run check:ci:linux-primary

  # Keep wall-clock measurements on an otherwise idle hosted Linux runner.
  benchmarks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    name: node 24 / benchmarks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Install benchmark browser and hosted dependencies
        run: pnpm --filter @deepseek-ai/dsh-benchmarks exec playwright install --with-deps chromium

      - name: Run performance benchmarks
        env:
          DSH_GATE_VERBOSE: '1'
        run: pnpm run check:ci:bench

      - name: Upload scaled benchmark report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmark-report
          path: benchmarks/.dsh-report/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # TODO(hosted-serial-ci): Re-enable the one remaining disabled hosted serial
  # reference job (serial-macos) before release. Re-enabling serial-macos does
  # not restore a Linux hosted-cache producer: decide whether to add a master
  # seeder or remove the restore-only steps if cold starts become a concern.
  serial-macos:
    if: false
    name: serial / macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run complete unsharded primary Node CI serially
        env:
          DSH_COVERAGE_MAX_WORKERS: '1'
          DSH_E2E_MAX_WORKERS: '1'
          DSH_GATE_CONCURRENCY: '1'
          DSH_PUBLINT_CONCURRENCY: '1'
          DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
        run: pnpm run check:ci

  # Manual, bounded comparison of Linux runner tiers.
  # The named pools are restricted at the organization level to this repository.
  larger-runner-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'larger-runner-benchmark'
    # Linux's Blacksmith failover switch redirects supported tiers; 64/96-core
    # rows stay on fleet runners because Blacksmith offers no matching machines.
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'blacksmith' && matrix.blacksmith || matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - cores: '4'
            runner: dsh-ubuntu-24-04-4core
            blacksmith: blacksmith-4vcpu-ubuntu-2404
          - cores: '8'
            runner: dsh-ubuntu-24-04-8core
            blacksmith: blacksmith-8vcpu-ubuntu-2404
          - cores: '16'
            runner: dsh-ubuntu-24-04-16core
            blacksmith: blacksmith-16vcpu-ubuntu-2404
          - cores: '32'
            runner: dsh-ubuntu-24-04-32core
            blacksmith: blacksmith-32vcpu-ubuntu-2404
          - cores: '64'
            runner: dsh-ubuntu-24-04-64core
            blacksmith: ''
          - cores: '96'
            runner: dsh-ubuntu-24-04-96core
            blacksmith: ''
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      # Cache the package store for the Linux runner tiers.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Report runner capacity
        run: >-
          node -e "const os = require('node:os');
          console.log(JSON.stringify({ arch: process.arch, cpus: os.cpus().length,
          memoryGiB: Math.round(os.totalmem() / 2 ** 30) }))"

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run critical Linux typecheck lane
        run: pnpm run typecheck

  # Manual comparison of the intended low-fanout Linux runner topology.
  consolidated-runner-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'consolidated-runner-benchmark'
    # Linux's Blacksmith failover switch redirects supported tiers; 64/96-core
    # rows stay on fleet runners because Blacksmith offers no matching machines.
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'blacksmith' && matrix.blacksmith || matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - cores: '4'
            runner: dsh-ubuntu-24-04-4core
            blacksmith: blacksmith-4vcpu-ubuntu-2404
            workers: '4'
          - cores: '8'
            runner: dsh-ubuntu-24-04-8core
            blacksmith: blacksmith-8vcpu-ubuntu-2404
            workers: '8'
          - cores: '16'
            runner: dsh-ubuntu-24-04-16core
            blacksmith: blacksmith-16vcpu-ubuntu-2404
            workers: '16'
          - cores: '32'
            runner: dsh-ubuntu-24-04-32core
            blacksmith: blacksmith-32vcpu-ubuntu-2404
            workers: '32'
          - cores: '64'
            runner: dsh-ubuntu-24-04-64core
            blacksmith: ''
            workers: '32'
          - cores: '96'
            runner: dsh-ubuntu-24-04-96core
            blacksmith: ''
            workers: '32'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      # The consolidated topology measures package-store cache mechanics.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Report runner capacity
        run: >-
          node -e "const os = require('node:os');
          console.log(JSON.stringify({ arch: process.arch, cpus: os.cpus().length,
          memoryGiB: Math.round(os.totalmem() / 2 ** 30) }))"

      # No archive cache: this manual matrix includes the persistent 64/96-core
      # fleet rows, and a `~` cache written by an ephemeral runner does not
      # restore into the preparation directory there.
      - name: Install and prepare
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      - name: Run complete unsharded primary Node CI concurrently
        env:
          DSH_COVERAGE_MAX_WORKERS: ${{ matrix.workers }}
          DSH_GATE_CONCURRENCY: ${{ matrix.workers }}
          DSH_OXLINT_THREADS: ${{ matrix.workers }}
          DSH_PUBLINT_CONCURRENCY: ${{ matrix.workers }}
          DSH_SNAPSHOT_MAX_CONCURRENCY: ${{ matrix.workers }}
        run: pnpm run check:ci
